<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Volunteer & NGO Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="index.html">
        <i class="bi bi-heart-pulse-fill text-primary"></i>
        <span>HopeConnect</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Browse Events</a></li>
        </ul>
        <div id="navAuthSection"></div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="custom-card p-4 p-md-5">
          <div class="text-center mb-4">
            <h3 class="fw-bold mb-1">Create an Account</h3>
            <p class="text-muted small">Select your role and start your journey</p>

            <!-- Role Selector Toggle -->
            <div class="btn-group w-100 mt-3 p-1 bg-light rounded-3 border" role="group">
              <input type="radio" class="btn-check" name="roleToggle" id="roleVolunteer" value="volunteer" checked>
              <label class="btn btn-outline-primary rounded-3 border-0 py-2 fw-semibold" for="roleVolunteer">
                <i class="bi bi-person me-1"></i> I am a Volunteer
              </label>

              <input type="radio" class="btn-check" name="roleToggle" id="roleNGO" value="ngo">
              <label class="btn btn-outline-primary rounded-3 border-0 py-2 fw-semibold" for="roleNGO">
                <i class="bi bi-building me-1"></i> I represent an NGO
              </label>
            </div>
          </div>

          <form id="registerForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Full Name *</label>
                <input type="text" id="regName" class="form-control" placeholder="John Doe" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Email Address *</label>
                <input type="email" id="regEmail" class="form-control" placeholder="john@example.com" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Password *</label>
                <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" minlength="6" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Phone Number</label>
                <input type="tel" id="regPhone" class="form-control" placeholder="9876543210">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">City</label>
                <input type="text" id="regCity" class="form-control" placeholder="e.g. Mumbai, Bengaluru">
              </div>

              <div class="col-md-6 d-none" id="orgNameContainer">
                <label class="form-label fw-semibold">Organization Name *</label>
                <input type="text" id="regOrgName" class="form-control" placeholder="Green Foundation">
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Bio / Description</label>
                <textarea id="regBio" class="form-control" rows="2" placeholder="Tell us about yourself or your organization's mission..."></textarea>
              </div>
            </div>

            <button type="submit" id="regSubmitBtn" class="btn btn-primary-custom w-100 py-2.5 fw-bold mt-4 mb-3">
              Complete Registration <i class="bi bi-check-circle ms-1"></i>
            </button>
          </form>

          <p class="text-center mt-3 mb-0 small text-muted">
            Already registered? <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign in here</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    const roleVolunteer = document.getElementById('roleVolunteer');
    const roleNGO = document.getElementById('roleNGO');
    const orgContainer = document.getElementById('orgNameContainer');

    function toggleRoleFields() {
      if (roleNGO.checked) {
        orgContainer.classList.remove('d-none');
      } else {
        orgContainer.classList.add('d-none');
      }
    }

    roleVolunteer.addEventListener('change', toggleRoleFields);
    roleNGO.addEventListener('change', toggleRoleFields);

    // Check query params for role selector auto-fill
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('role') === 'ngo') {
      roleNGO.checked = true;
      toggleRoleFields();
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const role = roleNGO.checked ? 'ngo' : 'volunteer';
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const phone = document.getElementById('regPhone').value.trim();
      const city = document.getElementById('regCity').value.trim();
      const organization_name = document.getElementById('regOrgName').value.trim();
      const bio = document.getElementById('regBio').value.trim();

      const btn = document.getElementById('regSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...`;

      try {
        const response = await API.post('/auth/register', {
          name, email, password, role, phone, city, organization_name, bio
        });

        API.setAuth(response.token, response.user);
        showToast(response.message, 'success');

        setTimeout(() => {
          if (response.user.role === 'ngo') {
            window.location.href = 'dashboard-ngo.html';
          } else {
            window.location.href = 'dashboard-volunteer.html';
          }
        }, 1200);

      } catch (err) {
        showToast(err.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = `Complete Registration <i class="bi bi-check-circle ms-1"></i>`;
      }
    });
  </script>
</body>
</html>
