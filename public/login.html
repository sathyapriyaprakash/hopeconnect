<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Volunteer & NGO Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="index.html">
        <i class="bi bi-heart-pulse-fill text-primary"></i>
        <span>HopeConnect</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Browse Events</a></li>
        </ul>
        <div id="navAuthSection"></div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="custom-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="stat-icon indigo mx-auto mb-3" style="width:56px; height:56px; font-size:1.6rem;">
              <i class="bi bi-box-arrow-in-right"></i>
            </div>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to access your portal dashboard</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
              </div>
            </div>

            <button type="submit" id="loginSubmitBtn" class="btn btn-primary-custom w-100 py-2.5 fw-bold mb-3">
              Sign In <i class="bi bi-arrow-right ms-1"></i>
            </button>
          </form>

          <!-- Viva Quick Fill Demo Credentials -->
          <div class="border-top pt-3 mt-4 text-center">
            <small class="text-muted fw-semibold d-block mb-2"><i class="bi bi-lightning-charge text-warning"></i> Viva Demo Quick-Fill Accounts:</small>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="quickFill('aarav@gmail.com', 'password123')">🙋 Volunteer</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="quickFill('ngo@greenearth.org', 'password123')">🏢 NGO Host</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="quickFill('admin@portal.org', 'password123')">👑 Admin</button>
            </div>
          </div>

          <p class="text-center mt-4 mb-0 small text-muted">
            Don't have an account? <a href="register.html" class="fw-bold text-primary text-decoration-none">Register now</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    function quickFill(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginSubmitBtn');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Signing in...`;

      try {
        const response = await API.post('/auth/login', { email, password });
        API.setAuth(response.token, response.user);
        showToast('Login successful! Redirecting...', 'success');

        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');

        setTimeout(() => {
          if (redirect) {
            window.location.href = redirect;
          } else if (response.user.role === 'ngo') {
            window.location.href = 'dashboard-ngo.html';
          } else if (response.user.role === 'admin') {
            window.location.href = 'dashboard-admin.html';
          } else {
            window.location.href = 'dashboard-volunteer.html';
          }
        }, 1000);

      } catch (err) {
        showToast(err.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = `Sign In <i class="bi bi-arrow-right ms-1"></i>`;
      }
    });
  </script>
</body>
</html>
